<!doctype html>
<html lang="uk">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>AI Automator — калькулятори</title>
<meta name="theme-color" content="#10131a">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&display=swap" rel="stylesheet">
<style>
  :root{color-scheme:dark;--bg:#10131a;--surface:#171b23;--line:#2a2f3a;--text:#e8e6de;--text-dim:#8b93a1;--teal:#4fd1c5;}
  *{box-sizing:border-box;}
  body{margin:0;min-height:100vh;display:flex;align-items:center;justify-content:center;background:var(--bg);color:var(--text);font:1rem/1.5 "Space Grotesk",system-ui,sans-serif;padding:1.5rem;}
  .card{max-width:26rem;width:100%;}
  h1{font-size:1.4rem;margin:0 0 0.5rem;letter-spacing:-0.02em;}
  p{color:var(--text-dim);font-size:0.9rem;margin:0 0 1.5rem;}
  a.btn{display:block;padding:1rem 1.25rem;border:1px solid var(--line);border-radius:12px;background:var(--surface);color:var(--text);text-decoration:none;font-weight:600;transition:border-color 150ms;}
  a.btn:hover{border-color:var(--teal);}
  a.btn span{display:block;font-size:0.78rem;font-weight:400;color:var(--text-dim);margin-top:0.2rem;}
</style>
</head>
<body>
  <div class="card">
    <h1>Калькулятори AI Automator</h1>
    <p>Інструменти для оцінки вартості проєктів автоматизації.</p>
    <a class="btn" href="cost/">
      Калькулятор вартості
      <span>Порахуйте вигоду й орієнтовну ціну проєкту</span>
    </a>
  </div>
</body>
</html>
