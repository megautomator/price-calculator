<!doctype html>
<html lang="uk">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Калькулятор вартості</title>
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#10131a">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Вартість">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" href="icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet">
<style>
  :root{
    color-scheme:dark;
    --bg:#10131a;
    --surface:#171b23;
    --surface-2:#1e232d;
    --line:#2a2f3a;
    --line-strong:#3a404d;
    --text:#e8e6de;
    --text-dim:#8b93a1;
    --amber:#e8a33d;
    --teal:#4fd1c5;
    --radius:12px;
    --sans:"Space Grotesk",system-ui,-apple-system,sans-serif;
    --mono:"JetBrains Mono",ui-monospace,SFMono-Regular,monospace;
  }
  *{box-sizing:border-box;}
  body{
    margin:0;
    background:var(--bg);
    color:var(--text);
    font:1rem/1.5 var(--sans);
    padding-bottom:6.5rem;
    -webkit-font-smoothing:antialiased;
  }
  .num{font-family:var(--mono);font-variant-numeric:tabular-nums;}
  .wrap{max-width:47.5rem;margin:0 auto;padding:1.75rem 1.25rem 2.5rem;}
  :focus-visible{outline:2px solid var(--teal);outline-offset:2px;}
  [hidden]{display:none !important;}

  /* ---------- шапка ---------- */
  .top{display:flex;justify-content:space-between;align-items:flex-start;gap:1rem 1.5rem;flex-wrap:wrap;margin-bottom:1.75rem;}
  .top h1{margin:0;font-size:1.5rem;font-weight:600;line-height:1.15;letter-spacing:-0.02em;}
  .top > div:first-child{flex:1 1 18rem;}
  .top .lede{margin:0.25rem 0 0;color:var(--text-dim);font-size:0.875rem;max-width:28rem;}
  .controls{display:grid;gap:0.5rem;justify-items:end;}
  .controls-row{display:flex;gap:0.5rem;align-items:center;}
  .fx-note{margin:0;font-size:0.72rem;color:var(--text-dim);text-align:right;}
  @media (max-width:560px){ .controls{justify-items:start;} .fx-note{text-align:left;} }

  select, input[type="number"], input[type="text"]{
    background:var(--surface-2);
    border:1px solid var(--line);
    color:var(--text);
    font:inherit;
    font-size:0.9rem;
    border-radius:8px;
    padding:0.5rem 0.65rem;
    min-width:0;
    transition:border-color 120ms ease-out;
  }
  select:hover, input:hover{border-color:var(--line-strong);}
  input[type="number"]{font-family:var(--mono);font-variant-numeric:tabular-nums;}
  #currency{font-weight:600;}

  .seg{display:flex;gap:0.25rem;padding:0.2rem;border:1px solid var(--line);border-radius:9px;background:var(--surface-2);}
  .seg button{
    font:inherit;font-size:0.78rem;font-weight:600;
    padding:0.3rem 0.6rem;border-radius:6px;border:none;
    background:transparent;color:var(--text-dim);cursor:pointer;
    transition:transform 100ms ease-out, background-color 120ms ease-out, color 120ms ease-out;
  }
  .seg button:active{transform:scale(0.96);}
  .seg button[aria-pressed="true"]{background:var(--line);color:var(--text);}

  /* ---------- панелі ---------- */
  .panel{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);padding:1.25rem 1.375rem;}
  .panel h2{margin:0 0 0.25rem;font-size:0.8125rem;font-weight:600;letter-spacing:0.01em;color:var(--text-dim);}
  .panel .sub{margin:0 0 1rem;font-size:0.75rem;color:var(--text-dim);}
  .connector{display:flex;justify-content:center;height:1.75rem;color:var(--line-strong);}

  /* ---------- послуга ---------- */
  .service-row{display:flex;gap:0.6rem;flex-wrap:wrap;margin-top:0.75rem;}
  .service-row select{flex:2 1 16rem;max-width:100%;}
  .hours{flex:1 1 8rem;display:flex;align-items:center;gap:0.5rem;font-size:0.875rem;color:var(--text-dim);}
  .hours input{width:100%;}
  #custom-wrap{margin-top:0.6rem;}
  #custom-wrap input{width:100%;}
  .hint{margin:0.5rem 0 0;font-size:0.75rem;color:var(--text-dim);}

  /* ---------- картки вигоди ---------- */
  .cards{display:grid;grid-template-columns:1fr 1fr;gap:0.875rem;}
  @media (max-width:600px){ .cards{grid-template-columns:1fr;} }
  .card{
    display:flex;flex-direction:column;
    padding:1rem 1.05rem;border:1px solid var(--line);border-radius:10px;
    background:var(--surface-2);
    transition:border-color 200ms ease-out;
  }
  .card.on{border-color:rgba(79,209,197,0.55);}
  .card h3{margin:0;font-size:0.9rem;font-weight:600;}
  .card .formula{margin:0.15rem 0 0.75rem;font-size:0.72rem;color:var(--text-dim);}
  .card label{display:block;font-size:0.75rem;color:var(--text-dim);margin:0.5rem 0 0.2rem;}
  .card input{width:100%;}
  .card .result{
    margin-top:auto;padding-top:0.75rem;
    display:flex;justify-content:space-between;align-items:baseline;gap:0.5rem;
    font-size:0.8rem;color:var(--text-dim);
  }
  .card .result .num{font-size:1.05rem;font-weight:700;color:var(--text);}
  .card.on .result .num{color:var(--teal);}
  .card .example{margin:0.6rem 0 0;font-size:0.7rem;color:var(--text-dim);opacity:0.8;}
  .roi-total{
    display:grid;gap:0.3rem;margin-top:1rem;padding-top:0.85rem;
    border-top:1px solid var(--line);font-size:0.8125rem;color:var(--text-dim);
  }
  .roi-total div{display:flex;justify-content:space-between;gap:1rem;}
  .roi-total .num{color:var(--text);}
  .roi-total .strong .num{color:var(--teal);font-weight:700;}
  .roi-verdict{margin:0.75rem 0 0;padding-top:0.75rem;border-top:1px solid var(--line);font-size:0.85rem;}
  .roi-verdict .num{color:var(--teal);font-weight:700;}

  /* ---------- вартість роботи й вигода: один ланцюжок, не дві конкуруючі ціни ---------- */
  .branches{display:grid;grid-template-columns:1fr 1fr;gap:0.875rem;}
  @media (max-width:560px){ .branches{grid-template-columns:1fr;} }
  .branch{padding:1.1rem;border:1px solid var(--line);border-radius:10px;background:var(--surface-2);}
  .branch h3{margin:0;font-size:0.8125rem;font-weight:600;color:var(--text-dim);}
  .branch .formula{margin:0.15rem 0 0.75rem;font-size:0.72rem;color:var(--text-dim);}
  .big{font-family:var(--mono);font-variant-numeric:tabular-nums;font-weight:700;line-height:1;letter-spacing:-0.02em;}
  .branch .big{font-size:1.5rem;color:var(--text-dim);}
  /* картка вигоди — єдина, що веде бірюзовим кольором до підсумку на кроці 4 */
  .branch.value{border-color:rgba(79,209,197,0.35);}
  .branch.value h3{color:var(--teal);}
  .branch.value .big{color:var(--teal);}

  /* ---------- підсумок ---------- */
  .summary .service-name{font-size:0.9rem;color:var(--text-dim);margin-bottom:0.4rem;}
  #final-out{font-size:3rem;}
  #final-out.f1{color:var(--amber);}
  #final-out.f2{color:var(--teal);}
  .verdict{margin:0.6rem 0 0.2rem;font-size:0.9rem;}
  .payback{margin:0;font-size:0.85rem;color:var(--text-dim);}
  .copy-btn{
    margin-top:1.1rem;font:inherit;font-size:0.9rem;font-weight:600;
    padding:0.6rem 1rem;border-radius:9px;border:1px solid var(--line-strong);
    background:var(--surface-2);color:var(--text);cursor:pointer;
    transition:transform 100ms ease-out, border-color 120ms ease-out;
  }
  .copy-btn:hover{border-color:var(--teal);}
  .copy-btn:active{transform:scale(0.97);}

  /* ---------- налаштування ---------- */
  details.settings{margin-top:1.5rem;border:1px dashed var(--line);border-radius:10px;padding:0.6rem 0.9rem;}
  details.settings summary{cursor:pointer;font-size:0.78rem;color:var(--text-dim);}
  .settings-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(9rem,1fr));gap:0.75rem;margin:0.9rem 0 0.4rem;}
  .settings-grid label{display:block;font-size:0.72rem;color:var(--text-dim);margin-bottom:0.2rem;}
  .settings-grid input, .settings-grid select{width:100%;}

  /* ---------- скляна нижня панель ---------- */
  .bar{
    position:fixed;inset:auto 0 0 0;
    display:flex;justify-content:center;gap:2.5rem;
    padding:0.75rem 1.25rem calc(0.75rem + env(safe-area-inset-bottom));
    background:rgba(23,27,35,0.72);
    -webkit-backdrop-filter:blur(20px) saturate(160%);
    backdrop-filter:blur(20px) saturate(160%);
    border-top:1px solid rgba(255,255,255,0.07);
    z-index:10;
  }
  .bar .item{display:grid;justify-items:center;gap:0.1rem;}
  .bar .label{font-size:0.72rem;color:var(--text-dim);letter-spacing:0.02em;}
  .bar .big{font-size:1.15rem;}
  .foot{margin-top:1.25rem;text-align:center;font-size:0.75rem;color:var(--text-dim);}

  @media (prefers-reduced-transparency: reduce){
    .bar{background:var(--surface);-webkit-backdrop-filter:none;backdrop-filter:none;}
  }
  @media (prefers-contrast: more){
    :root{--line:#59606e;--text-dim:#b9bfca;}
    .branch{opacity:0.8;}
  }
  @media (prefers-reduced-motion: reduce){ *{transition:none !important;} }
</style>
</head>
<body>
<div class="wrap">

  <header class="top">
    <div>
      <h1 data-i18n="title"></h1>
      <p class="lede" data-i18n="lede"></p>
    </div>
    <div class="controls">
      <div class="controls-row">
        <div class="seg" role="group" aria-label="Language / Мова">
          <button type="button" data-lang="uk">UA</button>
          <button type="button" data-lang="en">EN</button>
        </div>
        <select id="currency" aria-label="Currency">
          <option value="UAH">₴ UAH</option>
          <option value="USD">$ USD</option>
          <option value="EUR">€ EUR</option>
        </select>
      </div>
      <p class="fx-note" id="fx-note"></p>
    </div>
  </header>

  <!-- 1. Послуга -->
  <section class="panel" aria-labelledby="h-svc">
    <h2 id="h-svc" data-i18n="svc_h"></h2>
    <div class="service-row">
      <select id="service" aria-labelledby="h-svc"></select>
      <label class="hours"><input type="number" id="service-hours" min="0.5" step="0.5" inputmode="decimal"><span data-i18n="hours_unit"></span></label>
    </div>
    <div id="custom-wrap" hidden>
      <input type="text" id="custom-name" data-i18n-ph="custom_ph">
    </div>
    <p class="hint" data-i18n="svc_hint"></p>
  </section>

  <div class="connector" aria-hidden="true"><svg width="12" height="28" viewBox="0 0 12 28"><path d="M6 2v20M1.5 17.5 6 22l4.5-4.5" fill="none" stroke="currentColor" stroke-width="1.5"/></svg></div>

  <!-- 2. Вигода клієнта -->
  <section class="panel" aria-labelledby="h-roi">
    <h2 id="h-roi" data-i18n="roi_h"></h2>
    <p class="sub" data-i18n="roi_sub"></p>
    <div class="cards">
      <div class="card" id="card-time">
        <h3 data-i18n="c1_t"></h3>
        <p class="formula" data-i18n="c1_f"></p>
        <label for="t-hours" data-i18n="c1_a"></label>
        <input type="number" id="t-hours" min="0" step="1" inputmode="decimal" placeholder="0">
        <label for="t-cost" data-i18n-cur="c1_b"></label>
        <input type="number" id="t-cost" min="0" step="any" inputmode="decimal" placeholder="0" data-money="tCost">
        <div class="result"><span data-i18n="per_month"></span><span class="num" id="r-time"></span></div>
        <p class="example" id="ex-time"></p>
      </div>
      <div class="card" id="card-hire">
        <h3 data-i18n="c2_t"></h3>
        <p class="formula" data-i18n="c2_f"></p>
        <label for="h-count" data-i18n="c2_a"></label>
        <input type="number" id="h-count" min="0" step="1" inputmode="decimal" placeholder="0">
        <label for="h-salary" data-i18n-cur="c2_b"></label>
        <input type="number" id="h-salary" min="0" step="any" inputmode="decimal" placeholder="0" data-money="hSalary">
        <div class="result"><span data-i18n="per_month"></span><span class="num" id="r-hire"></span></div>
        <p class="example" id="ex-hire"></p>
      </div>
      <div class="card" id="card-rev">
        <h3 data-i18n="c3_t"></h3>
        <p class="formula" data-i18n="c3_f"></p>
        <label for="v-clients" data-i18n="c3_a"></label>
        <input type="number" id="v-clients" min="0" step="1" inputmode="decimal" placeholder="0">
        <label for="v-check" data-i18n-cur="c3_b"></label>
        <input type="number" id="v-check" min="0" step="any" inputmode="decimal" placeholder="0" data-money="vCheck">
        <label for="v-retain" data-i18n="c3_c"></label>
        <input type="number" id="v-retain" min="0" max="100" step="1" inputmode="decimal" placeholder="0">
        <div class="result"><span data-i18n="per_month"></span><span class="num" id="r-rev"></span></div>
        <p class="example" id="ex-rev"></p>
      </div>
      <div class="card" id="card-cost">
        <h3 data-i18n="c4_t"></h3>
        <p class="formula" data-i18n="c4_f"></p>
        <label for="d-count" data-i18n="c4_a"></label>
        <input type="number" id="d-count" min="0" step="1" inputmode="decimal" placeholder="0">
        <label for="d-cost" data-i18n-cur="c4_b"></label>
        <input type="number" id="d-cost" min="0" step="any" inputmode="decimal" placeholder="0" data-money="dCost">
        <div class="result"><span data-i18n="per_month"></span><span class="num" id="r-cost"></span></div>
        <p class="example" id="ex-cost"></p>
      </div>
    </div>
    <div class="roi-total">
      <div><span data-i18n="total_m"></span><span class="num" id="total-m"></span></div>
      <div class="strong"><span data-i18n="total_y"></span><span class="num" id="total-y"></span></div>
    </div>
    <p class="roi-verdict" id="roi-verdict"></p>
  </section>

  <div class="connector" aria-hidden="true"><svg width="12" height="28" viewBox="0 0 12 28"><path d="M6 2v20M1.5 17.5 6 22l4.5-4.5" fill="none" stroke="currentColor" stroke-width="1.5"/></svg></div>

  <!-- 3. Дві формули -->
  <section class="panel" aria-labelledby="h-f">
    <h2 id="h-f" data-i18n="f_h"></h2>
    <p class="sub" data-i18n="f_sub"></p>
    <div class="branches">
      <div class="branch cost" id="branch-f1">
        <h3 data-i18n="f1_t"></h3>
        <p class="formula" id="f1-formula"></p>
        <span class="big" id="f1-out"></span>
      </div>
      <div class="branch value" id="branch-f2">
        <h3 data-i18n="f2_t"></h3>
        <p class="formula" id="f2-formula"></p>
        <span class="big" id="f2-out"></span>
      </div>
    </div>
  </section>

  <div class="connector" aria-hidden="true"><svg width="12" height="28" viewBox="0 0 12 28"><path d="M6 2v20M1.5 17.5 6 22l4.5-4.5" fill="none" stroke="currentColor" stroke-width="1.5"/></svg></div>

  <!-- 4. Підсумок -->
  <section class="panel summary" aria-labelledby="h-sum">
    <h2 id="h-sum" data-i18n="sum_h"></h2>
    <div class="service-name" id="summary-service"></div>
    <span class="big" id="final-out"></span>
    <p class="verdict" id="verdict"></p>
    <p class="payback" id="payback"></p>
    <button type="button" class="copy-btn" id="copy" data-i18n="copy"></button>
  </section>

  <!-- Налаштування консультанта -->
  <details class="settings">
    <summary data-i18n="set_h"></summary>
    <div class="settings-grid">
      <div><label for="s-rate" data-i18n="set_rate"></label><input type="number" id="s-rate" min="1" step="0.5"></div>
      <div><label for="s-div" data-i18n="set_div"></label>
        <select id="s-div"><option value="5" data-i18n="div5"></option><option value="3" data-i18n="div3"></option></select></div>
      <div><label for="s-uah">1 $ = ₴</label><input type="number" id="s-uah" min="0.01" step="0.1"></div>
      <div><label for="s-eur">1 $ = €</label><input type="number" id="s-eur" min="0.01" step="0.01"></div>
      <div><label for="s-date" data-i18n="set_date"></label><input type="text" id="s-date" placeholder="2026-10-02"></div>
    </div>
  </details>

  <p class="foot" data-i18n="foot"></p>
</div>

<div class="bar" aria-hidden="true">
  <div class="item"><span class="label" data-i18n="bar"></span><span class="big" id="bar-price"></span></div>
</div>

<script>
(function(){
  "use strict";

  /* ---------- тексти UA / EN ---------- */
  var T = {
    uk:{
      title:"Калькулятор вартості",
      lede:"Оберіть послугу й заповніть картки вигоди, які стосуються вашого бізнесу. Побачите орієнтовну ціну й за скільки вона окупиться.",
      fx:"Курс на {d}: 1 $ = {u} ₴ · {e} €",
      svc_h:"1. Послуга",
      hours_unit:"год",
      custom_ph:"Назва вашого проєкту",
      svc_hint:"Години — орієнтир. Точний обсяг уточнюємо після ТЗ.",
      s1:"Міні-аудит процесів", s2:"Лід-захоплення й AI-кваліфікація", s3:"AI-бот для замовлень, продажів, пошти",
      s4:"Voice AI-агент", s5:"Аналітика продажів і підтримки", s_custom:"Свій проєкт",
      roi_h:"2. Скільки ви заощадите",
      roi_sub:"Заповнюйте лише ті картки, що підходять. Якщо дві описують ту саму вигоду — залиште одну, більшу.",
      c1_t:"Заощаджений час", c1_f:"годин на місяць × вартість години співробітника",
      c1_a:"Годин на місяць звільниться", c1_b:"Вартість години співробітника, {s}",
      c2_t:"Економія на наймі", c2_f:"кількість ставок × зарплата на місяць",
      c2_a:"Скільки людей не доведеться наймати", c2_b:"Зарплата однієї людини на місяць, {s}",
      c3_t:"Врятована виручка", c3_f:"клієнтів під ризиком × середній чек × % утримання",
      c3_a:"Клієнтів на місяць, яких ви втрачаєте", c3_b:"Середній чек, {s}", c3_c:"Скільки з них утримаємо, %",
      c4_t:"Прямі витрати, яких уникли", c4_f:"помилок на місяць × вартість однієї",
      c4_a:"Помилок на місяць", c4_b:"Вартість однієї помилки, {s}",
      per_month:"на місяць",
      ex:"Приклад: ",
      h:"год", people:"люд.", mo:"/міс",
      total_m:"Вигода на місяць", total_y:"Вигода на рік",
      roi_verdict:"Загалом ваш бізнес може заощаджувати {y} щороку завдяки цій автоматизації.",
      roi_empty:"Заповніть хоча б одну картку вище, щоб побачити загальну вигоду.",
      f_h:"3. Вартість роботи й ваша вигода",
      f_sub:"Зліва — скільки коштує сама робота. Справа — скільки ви заощаджуєте (з кроку 2). Як ці дві цифри складаються в ціну — показано нижче.",
      f1_t:"Вартість роботи", f2_t:"Ваша вигода (на рік)",
      f1_formula:"{h} год × {r}/год × 1,5 (буфер на правки й комунікацію)",
      f2_formula:"сума карток вигоди з кроку 2 × 12 міс.",
      f2_empty:"Заповніть хоча б одну картку вигоди на кроці 2",
      sum_h:"4. Орієнтовна вартість",
      v_f1:"Вартість проєкту: {f1} — базова ціна за обсягом роботи.",
      v_f1_roi:"Вартість проєкту: {f1} — базова ціна за обсягом роботи. Вона вища за оцінку вашої вигоди ({y} на рік), тож саме вона визначає ціну.",
      v_f2:"Вартість робіт за обсягом — {f1}. Але очікувана вигода для вашого бізнесу — {y} на рік, тому ціну розраховано від вигоди (1/{d} річної економії) — {f2}.",
      payback:"Окупиться приблизно за {m} міс.",
      copy:"Скопіювати розрахунок", copied:"Скопійовано ✓",
      set_h:"Налаштування консультанта",
      set_rate:"Ставка, $/год", set_div:"Частка від вигоди",
      div5:"÷5 — обережно", div3:"÷3 — сміливо",
      set_date:"Дата курсу",
      foot:"Розрахунок орієнтовний. Остаточна ціна — після обговорення ТЗ.",
      bar:"орієнтовна вартість",
      c_service:"Послуга", c_hours:"Години", c_benefit:"Вигода на рік", c_price:"Орієнтовна вартість"
    },
    en:{
      title:"Project Cost Calculator",
      lede:"Pick a service and fill in the benefit cards that apply to your business. You'll see an estimated price and how fast it pays back.",
      fx:"Rate as of {d}: $1 = {u} ₴ · {e} €",
      svc_h:"1. Service",
      hours_unit:"h",
      custom_ph:"Your project name",
      svc_hint:"Hours are an estimate. Exact scope is confirmed after the brief.",
      s1:"Process mini-audit", s2:"Lead capture & AI qualification", s3:"AI bot for orders, sales, email",
      s4:"Voice AI agent", s5:"Sales & support analytics", s_custom:"Custom project",
      roi_h:"2. What you'll save",
      roi_sub:"Fill in only the cards that apply. If two describe the same benefit, keep just the larger one.",
      c1_t:"Time saved", c1_f:"hours per month × employee hourly cost",
      c1_a:"Hours freed up per month", c1_b:"Employee hourly cost, {s}",
      c2_t:"Hire avoided", c2_f:"positions × monthly salary",
      c2_a:"People you won't need to hire", c2_b:"Monthly salary per person, {s}",
      c3_t:"Revenue saved", c3_f:"clients at risk × average order × % retained",
      c3_a:"Clients lost per month", c3_b:"Average order value, {s}", c3_c:"Share we'll retain, %",
      c4_t:"Direct costs avoided", c4_f:"errors per month × cost per error",
      c4_a:"Errors per month", c4_b:"Cost of one error, {s}",
      per_month:"per month",
      ex:"Example: ",
      h:"h", people:"ppl", mo:"/mo",
      total_m:"Benefit per month", total_y:"Benefit per year",
      roi_verdict:"Overall, your business could save {y} every year from this automation.",
      roi_empty:"Fill in at least one card above to see the total benefit.",
      f_h:"3. Cost of work vs. your benefit",
      f_sub:"On the left: what the work itself costs. On the right: what you save (from step 2). How the two combine into a price is explained below.",
      f1_t:"Cost of work", f2_t:"Your benefit (per year)",
      f1_formula:"{h} h × {r}/h × 1.5 (buffer for revisions & communication)",
      f2_formula:"sum of the benefit cards from step 2 × 12 mo.",
      f2_empty:"Fill in at least one benefit card in step 2",
      sum_h:"4. Estimated cost",
      v_f1:"Project cost: {f1} — base price for the scope of work.",
      v_f1_roi:"Project cost: {f1} — base price for the scope of work. It's higher than your estimated benefit ({y}/year), so it sets the price.",
      v_f2:"Cost of the work alone is {f1}. But the expected benefit to your business is {y}/year, so the price is based on that benefit (1/{d} of the yearly saving) — {f2}.",
      payback:"Pays back in about {m} months.",
      copy:"Copy estimate", copied:"Copied ✓",
      set_h:"Consultant settings",
      set_rate:"Rate, $/h", set_div:"Share of benefit",
      div5:"÷5 — conservative", div3:"÷3 — bold",
      set_date:"Rate date",
      foot:"This is an estimate. Final price follows the project brief.",
      bar:"estimated cost",
      c_service:"Service", c_hours:"Hours", c_benefit:"Yearly benefit", c_price:"Estimated cost"
    }
  };

  var SERVICES = [
    {id:"s1", hours:3}, {id:"s2", hours:8}, {id:"s3", hours:15},
    {id:"s4", hours:22}, {id:"s5", hours:12}, {id:"s_custom", hours:10}
  ];
  var CUR = {USD:"$", UAH:"₴", EUR:"€"};

  /* Усі гроші в state — у доларах. Валюта лише перераховує показ і ввід,
     тож перемикання туди-назад не накопичує похибку округлення. */
  var DEFAULTS = {
    lang:"uk", currency:"UAH",
    rate:25, divisor:5, rateUah:41, rateEur:0.92, rateDate:"2026-10-02",
    service:"s3", hoursBy:{}, customName:"",
    tHours:0, tCost:0, hCount:0, hSalary:0,
    vClients:0, vCheck:0, vRetain:0, dCount:0, dCost:0
  };
  var KEY = "cost-calc-v1";

  var state = JSON.parse(JSON.stringify(DEFAULTS));
  try{
    var saved = JSON.parse(localStorage.getItem(KEY) || "null");
    if(saved) Object.assign(state, saved);
  }catch(e){}
  function save(){ try{ localStorage.setItem(KEY, JSON.stringify(state)); }catch(e){} }

  var $ = function(id){ return document.getElementById(id); };
  function t(k){ return T[state.lang][k]; }
  function fill(s, o){ return s.replace(/\{(\w+)\}/g, function(_, k){ return o[k]; }); }

  /* ---------- формат ---------- */
  function factor(cur){ cur = cur || state.currency; return cur === "UAH" ? state.rateUah : cur === "EUR" ? state.rateEur : 1; }
  function n(v, d){
    if(!isFinite(v)) return "—";
    return v.toLocaleString(state.lang === "en" ? "en-US" : "uk-UA", {minimumFractionDigits:d||0, maximumFractionDigits:d||0});
  }
  /* usd → у вибраній валюті */
  function money(usd, d){
    var v = usd * factor();
    return state.currency === "UAH" ? n(v, d) + " ₴" : CUR[state.currency] + n(v, d);
  }

  /* ---------- пружина для чисел (та сама, що на Сторінці 1) ---------- */
  var reduce = window.matchMedia("(prefers-reduced-motion: reduce)");
  var RESPONSE = 0.3, K = Math.pow(2 * Math.PI / RESPONSE, 2), C = 4 * Math.PI / RESPONSE;
  var springs = new Map(), raf = 0, last = 0;
  function show(node, target, format, instant){
    var s = springs.get(node);
    if(!s || instant || reduce.matches){
      springs.set(node, {x:target, v:0, target:target, format:format, done:true});
      node.textContent = format(target);
      return;
    }
    s.target = target; s.format = format; s.done = false;
    if(!raf) raf = requestAnimationFrame(tick);
  }
  function tick(time){
    var dt = last ? Math.min(0.05, (time - last) / 1000) : 0;
    last = time;
    var moving = false;
    springs.forEach(function(s, node){
      if(s.done) return;
      var rest = dt;
      while(rest > 0){
        var h = Math.min(rest, 1/240);
        s.v += (-K * (s.x - s.target) - C * s.v) * h;
        s.x += s.v * h;
        rest -= h;
      }
      var eps = Math.max(0.005, Math.abs(s.target) * 0.0002);
      if(Math.abs(s.x - s.target) < eps && Math.abs(s.v) < eps * 10){ s.x = s.target; s.v = 0; s.done = true; }
      else moving = true;
      node.textContent = s.format(s.x);
    });
    if(moving) raf = requestAnimationFrame(tick); else { raf = 0; last = 0; }
  }

  /* ---------- розрахунок (FORMULA.md, Шар Б) ---------- */
  function hours(){
    var v = state.hoursBy[state.service];
    if(v > 0) return v;
    for(var i = 0; i < SERVICES.length; i++) if(SERVICES[i].id === state.service) return SERVICES[i].hours;
    return 0;
  }
  function calc(){
    var time = state.tHours * state.tCost;
    var hire = state.hCount * state.hSalary;
    var rev  = state.vClients * state.vCheck * state.vRetain / 100;
    var cost = state.dCount * state.dCost;
    var monthly = time + hire + rev + cost;
    var yearly = monthly * 12;
    var h = hours();
    var f1 = h * state.rate * 1.5;
    var f2 = yearly / state.divisor;
    var final = Math.max(f1, f2);
    return {time:time, hire:hire, rev:rev, cost:cost, monthly:monthly, yearly:yearly,
            h:h, f1:f1, f2:f2, final:final, winner: f2 > f1 ? "f2" : "f1",
            payback: monthly > 0 ? final / monthly : 0};
  }

  /* ---------- поля вводу ---------- */
  var FIELDS = {
    "t-hours":"tHours", "t-cost":"tCost", "h-count":"hCount", "h-salary":"hSalary",
    "v-clients":"vClients", "v-check":"vCheck", "v-retain":"vRetain",
    "d-count":"dCount", "d-cost":"dCost"
  };
  var MONEY = {tCost:1, hSalary:1, vCheck:1, dCost:1};

  function writeInputs(skip){
    Object.keys(FIELDS).forEach(function(id){
      if(id === skip) return;
      var key = FIELDS[id], v = state[key];
      if(MONEY[key]) v = Math.round(v * factor() * 100) / 100;
      $(id).value = v ? v : "";
    });
  }

  /* ---------- мова ---------- */
  function applyLang(){
    document.documentElement.lang = state.lang === "en" ? "en" : "uk";
    document.title = t("title");
    document.querySelectorAll("[data-i18n]").forEach(function(el){ el.textContent = t(el.dataset.i18n); });
    document.querySelectorAll("[data-i18n-ph]").forEach(function(el){ el.placeholder = t(el.dataset.i18nPh); });
    document.querySelectorAll("[data-i18n-cur]").forEach(function(el){ el.textContent = fill(t(el.dataset.i18nCur), {s:CUR[state.currency]}); });
    document.querySelectorAll("[data-lang]").forEach(function(b){ b.setAttribute("aria-pressed", String(b.dataset.lang === state.lang)); });
    var sel = $("service");
    sel.innerHTML = SERVICES.map(function(s){ return '<option value="' + s.id + '">' + t(s.id) + '</option>'; }).join("");
    sel.value = state.service;
  }

  /* ---------- рендер ---------- */
  function render(instant){
    var r = calc();
    var m = function(d){ return function(v){ return money(v, d); }; };

    $("fx-note").textContent = fill(t("fx"), {d:state.rateDate || "—", u:n(state.rateUah, 2), e:n(state.rateEur, 2)});
    $("custom-wrap").hidden = state.service !== "s_custom";

    [["time", r.time], ["hire", r.hire], ["rev", r.rev], ["cost", r.cost]].forEach(function(p){
      show($("r-" + p[0]), p[1], m(0), instant);
      $("card-" + p[0]).classList.toggle("on", p[1] > 0);
    });
    $("ex-time").textContent = t("ex") + "40 " + t("h") + " × " + money(8) + " = " + money(320) + t("mo");
    $("ex-hire").textContent = t("ex") + "2 × " + money(800) + " = " + money(1600) + t("mo");
    $("ex-rev").textContent  = t("ex") + "20 × " + money(50) + " × 30% = " + money(300) + t("mo");
    $("ex-cost").textContent = t("ex") + "15 × " + money(20) + " = " + money(300) + t("mo");

    show($("total-m"), r.monthly, m(0), instant);
    show($("total-y"), r.yearly, m(0), instant);
    $("roi-verdict").textContent = r.yearly > 0 ? fill(t("roi_verdict"), {y:money(r.yearly)}) : t("roi_empty");

    $("f1-formula").textContent = fill(t("f1_formula"), {h:n(r.h, r.h % 1 ? 1 : 0), r:money(state.rate, 2)});
    $("f2-formula").textContent = r.yearly > 0 ? t("f2_formula") : t("f2_empty");
    show($("f1-out"), r.f1, m(0), instant);
    show($("f2-out"), r.yearly, m(0), instant);

    var name = state.service === "s_custom" ? (state.customName || t("s_custom")) : t(state.service);
    $("summary-service").textContent = name + " · " + n(r.h, r.h % 1 ? 1 : 0) + " " + t("h");
    show($("final-out"), r.final, m(0), instant);
    $("final-out").className = "big " + r.winner;
    var vArgs = {f1:money(r.f1, 0), y:money(r.yearly, 0), f2:money(r.f2, 0), d:state.divisor};
    $("verdict").textContent = r.winner === "f2" ? fill(t("v_f2"), vArgs)
                             : r.yearly > 0 ? fill(t("v_f1_roi"), vArgs) : fill(t("v_f1"), vArgs);
    $("payback").textContent = r.payback > 0 ? fill(t("payback"), {m:n(r.payback, 1)}) : "";
    show($("bar-price"), r.final, m(0), instant);
    save();
  }

  /* ---------- події ---------- */
  document.querySelectorAll("[data-lang]").forEach(function(b){
    b.addEventListener("click", function(){
      state.lang = b.dataset.lang;
      applyLang();
      render(true);
    });
  });

  $("currency").addEventListener("change", function(e){
    state.currency = e.target.value;
    applyLang();            // підписи полів містять символ валюти
    writeInputs();
    render(true);
  });

  $("service").addEventListener("change", function(e){
    state.service = e.target.value;
    $("service-hours").value = hours();
    render();
  });
  $("service-hours").addEventListener("input", function(e){
    var v = parseFloat(e.target.value);
    if(!(v > 0)) return;
    state.hoursBy[state.service] = v;
    render();
  });
  $("custom-name").addEventListener("input", function(e){ state.customName = e.target.value; render(); });

  Object.keys(FIELDS).forEach(function(id){
    $(id).addEventListener("input", function(e){
      var key = FIELDS[id];
      var v = parseFloat(e.target.value);
      if(!(v >= 0)) v = 0;
      if(key === "vRetain") v = Math.min(v, 100);
      state[key] = MONEY[key] ? v / factor() : v;
      render();
    });
  });

  function onSetting(key, min){
    return function(e){
      var v = parseFloat(e.target.value);
      if(!(v >= min)) return;
      state[key] = v;
      writeInputs();
      render();
    };
  }
  $("s-rate").addEventListener("input", onSetting("rate", 1));
  $("s-uah").addEventListener("input", onSetting("rateUah", 0.01));
  $("s-eur").addEventListener("input", onSetting("rateEur", 0.01));
  $("s-div").addEventListener("change", function(e){ state.divisor = parseInt(e.target.value, 10); render(); });
  $("s-date").addEventListener("input", function(e){ state.rateDate = e.target.value.trim(); render(); });

  $("copy").addEventListener("click", function(){
    var r = calc();
    var name = state.service === "s_custom" ? (state.customName || t("s_custom")) : t(state.service);
    var text = [
      t("c_service") + ": " + name,
      t("c_hours") + ": " + n(r.h, r.h % 1 ? 1 : 0),
      t("c_benefit") + ": " + money(r.yearly),
      t("c_price") + ": " + money(r.final)
    ].join("\n");
    var btn = $("copy");
    var done = function(){ btn.textContent = t("copied"); setTimeout(function(){ btn.textContent = t("copy"); }, 1600); };
    if(navigator.clipboard && navigator.clipboard.writeText){
      navigator.clipboard.writeText(text).then(done, function(){});
    }
  });

  /* ---------- старт ---------- */
  applyLang();
  $("currency").value = state.currency;
  $("service-hours").value = hours();
  $("custom-name").value = state.customName;
  $("s-rate").value = state.rate;
  $("s-div").value = String(state.divisor);
  $("s-uah").value = state.rateUah;
  $("s-eur").value = state.rateEur;
  $("s-date").value = state.rateDate;
  writeInputs();
  render(true);

  if("serviceWorker" in navigator){
    window.addEventListener("load", function(){
      navigator.serviceWorker.register("sw.js").catch(function(){});
    });
  }
})();
</script>
</body>
